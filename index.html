<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomaz de Oliveira dos Reis</title>
  <meta name="description" content="Personal website of Thomaz de Oliveira dos Reis (thor27)">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
      --btn-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(0, 0, 0, 0.08);
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --btn-bg: #f8fafc;
        --btn-hover: #e2e8f0;
        --btn-border: rgba(0, 0, 0, 0.1);
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .avatar-wrapper {
      margin-bottom: 1.5rem;
      display: inline-block;
      position: relative;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      background-color: var(--btn-bg);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: var(--text-primary);
    }

    .handle {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      transition: all 0.2s ease;
    }

    .link-button:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .link-button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="avatar-wrapper">
        <img
          class="avatar"
          src="https://avatars.githubusercontent.com/u/1656204?v=4"
          alt="Thomaz de Oliveira dos Reis"
          loading="lazy"
        />
      </div>

      <h1 class="name">Thomaz de Oliveira dos Reis</h1>
      <p class="handle">@thor27</p>
      <p class="bio">Software Developer & Open Source Enthusiast</p>

      <nav class="links" aria-label="Links and projects">
        <a
          href="https://thor27.github.io/video-cut/"
          class="link-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          <!-- Video Editor SVG Icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
          Video Cut (Video Editor)
        </a>

        <a
          href="https://github.com/thor27/"
          class="link-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          <!-- GitHub SVG Icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub
        </a>

        <a
          href="https://www.linkedin.com/in/thomaz-dos-reis/"
          class="link-button"
          target="_blank"
          rel="noopener noreferrer"
          id="linkedin-link"
        >
          <!-- LinkedIn SVG Icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
          LinkedIn
        </a>
      </nav>

      <footer class="footer">
        <p>&copy; Thomaz de Oliveira dos Reis</p>
      </footer>
    </div>
  </main>
</body>
</html>
